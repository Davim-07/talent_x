name: talent_x
description: "Application TalentX"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1 # Requis pour les binaires natifs Isar
  path_provider: ^2.1.2
  freezed_annotation: ^2.4.1  # Nécessaire pour les annotations @freezed en production
  json_annotation: ^4.9.0     # Nécessaire pour les annotations @JsonKey / @JsonSerializable

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Outils de génération de code (déplacés ici)
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true

  # Pensez à décommenter vos assets si nécessaire :
  # assets:
  #   - assets/images/
  #   - assets/icons/